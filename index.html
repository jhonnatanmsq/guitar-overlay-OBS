<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guitar Controller Overlay</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

<main class="overlay" aria-label="Guitar controller overlay">
    <section class="guitar-row" aria-label="Guitar inputs">
        <div class="frets">
            <img class="fret" data-control="verde" data-off="./Guitar/Fret1.png" data-on="./Guitar/Fret1h.png" src="./Guitar/Fret1.png" alt="Green fret">
            <img class="fret" data-control="vermelho" data-off="./Guitar/Fret2.png" data-on="./Guitar/Fret2h.png" src="./Guitar/Fret2.png" alt="Red fret">
            <img class="fret" data-control="amarelo" data-off="./Guitar/Fret3.png" data-on="./Guitar/Fret3h.png" src="./Guitar/Fret3.png" alt="Yellow fret">
            <img class="fret" data-control="azul" data-off="./Guitar/Fret4.png" data-on="./Guitar/Fret4h.png" src="./Guitar/Fret4.png" alt="Blue fret">
            <img class="fret" data-control="laranjado" data-off="./Guitar/Fret5.png" data-on="./Guitar/Fret5h.png" src="./Guitar/Fret5.png" alt="Orange fret">
        </div>

        <div class="stack" aria-label="Strum bar">
            <img class="control" data-control="strumUp" data-off="./Guitar/StrumUph.png" data-on="./Guitar/StrumUp.png" src="./Guitar/StrumUph.png" alt="Strum up">
            <img class="control" data-control="strumDown" data-off="./Guitar/StrumDownh.png" data-on="./Guitar/StrumDown.png" src="./Guitar/StrumDownh.png" alt="Strum down">
        </div>
    </section>

    <section class="guitar-row" aria-label="Auxiliary controls">
        <div class="stack">
            <img class="control" data-control="select" data-off="./Guitar/Selecth.png" data-on="./Guitar/Select.png" src="./Guitar/Selecth.png" alt="Select">
            <img class="control" data-control="start" data-off="./Guitar/Starth.png" data-on="./Guitar/Start.png" src="./Guitar/Starth.png" alt="Start">
        </div>

        <img class="control" data-control="especial" data-off="./Guitar/Whammyh.png" data-on="./Guitar/Whammy.png" src="./Guitar/Whammyh.png" alt="Whammy">
    </section>

    <section class="debug" aria-live="polite">
        <div class="debug-status" id="debug-status">Waiting for a gamepad...</div>
        <div id="debug-buttons"></div>
    </section>
</main>

<script src="./overlay.js"></script>

</body>
</html>
